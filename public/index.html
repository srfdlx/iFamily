<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>iFamily</title>
  <meta name="description" content="Familien-Aufgabenplaner: Aufgaben zuweisen, erinnern, Einkäufe in der Aufgabe sammeln" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="iFamily" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Vor dem ersten Rendern setzen, damit es nicht kurz aufblitzt
    try {
      const saved = localStorage.getItem('ifamily_theme');
      const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (err) { /* Speicher nicht verfügbar */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/js/app.js"></script>
</body>
</html>
